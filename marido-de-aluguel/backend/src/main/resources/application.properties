spring.application.name=marido-de-aluguel

# PostgreSQL (docker-compose.yml na raiz do repositório)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/marido_aluguel}
spring.datasource.username=${DB_USER:marido}
spring.datasource.password=${DB_PASSWORD:marido123}

# A estrutura do banco vem exclusivamente de database/schema.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT stateless (troque o segredo em produção: variável de ambiente JWT_SECRET, mínimo 32 caracteres)
app.jwt.secret=${JWT_SECRET:marido-de-aluguel-chave-de-desenvolvimento-troque-em-producao}
app.jwt.expiracao-minutos=480

# Origens extras liberadas no CORS (ex.: Live Server do VS Code). Mesma origem não precisa de CORS.
app.cors.origens=http://localhost:*,http://127.0.0.1:*

# O próprio Spring serve a SPA da pasta /frontend (rodando o back-end a partir de /backend)
spring.web.resources.static-locations=file:${FRONTEND_DIR:../frontend/},classpath:/static/
spring.web.resources.cache.period=0

server.error.include-message=always
