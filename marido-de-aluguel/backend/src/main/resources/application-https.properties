# Perfil opcional para RNF02 (HTTPS). Ative com: --spring.profiles.active=https
# Gere o certificado autoassinado conforme o README (keytool) e coloque keystore.p12 na pasta /backend.
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=file:keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${SSL_PASSWORD:marido123}
server.ssl.key-alias=marido
